<?xml version="1.0" encoding="UTF-8"?>
<svg width="450" height="70" viewBox="0 0 450 70" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <filter id="neonGlow" x="-1%" y="-1%" width="102%" height="102%">
      <feGaussianBlur stdDeviation="0.1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .neon-text {
        font-family: monospace;
        font-size: 20px;
        fill: #ffff00;
        font-weight: 600;
        filter: url(#neonGlow);
        text-rendering: optimizeLegibility;
      }
      .neon-cursor {
        fill: #ffff00;
        filter: url(#neonGlow);
        animation: neonBlink 1.0s ease-in-out infinite;
      }
      @keyframes neonBlink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0.4; }
      }
      .neon-char {
        opacity: 0;
        animation: neonType 0.84s linear 0.5s forwards;
      }
      .emoji-icon {
        opacity: 0;
        animation: neonType 0.84s linear 0.5s forwards;
      }
      @keyframes neonType {
        0% { opacity: 0; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .neon-char, .emoji-icon { animation: none; opacity: 1; transform: scale(1); }
        .neon-cursor { animation: none; opacity: 1; }
      }
    </style>
  </defs>
  
  <rect width="450" height="70" fill="#000011" rx="3"/>
  
  <g class="neon-text">
    <text x="20" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0s">S</tspan>
                </text><text x="32" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.06s">A</tspan>
                </text><text x="44" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.12s">K</tspan>
                </text><text x="56" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.18s">S</tspan>
                </text><text x="68" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.24s">H</tspan>
                </text><text x="80" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.3s">A</tspan>
                </text><text x="92" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.36s">M</tspan>
                </text><text x="104" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.42s">&#160;</tspan>
                </text><text x="116" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.48s">M</tspan>
                </text><text x="128" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.54s">A</tspan>
                </text><text x="140" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.6s">N</tspan>
                </text><text x="152" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.66s">G</tspan>
                </text><text x="164" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.72s">L</tspan>
                </text><text x="176" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-char" style="animation-delay: 0.78s">A</tspan>
                </text>
    
    <text x="188" y="41.666666666666664" class="neon-text">
                  <tspan class="neon-cursor" style="animation-delay: 1.3399999999999999s">▊</tspan>
                </text>
  </g>
</svg>